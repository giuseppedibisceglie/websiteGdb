const SITE_JS = `
    function goTo(name) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + name).classList.add('active');
      document.getElementById('page-' + name).scrollTop = 0;
    }
    (function initBioCarousel() {
      function start() {
        const carousel = document.querySelector('.bio-carousel');
        if (!carousel) return;
        const images = Array.from(carousel.querySelectorAll('img'));
        const dots = Array.from(carousel.querySelectorAll('.bio-carousel-dot'));
        if (images.length < 2) return;
        let current = 0, timer;
        function showSlide(index) {
          current = (index + images.length) % images.length;
          images.forEach((image, i) => image.classList.toggle('active', i === current));
          dots.forEach((dot, i) => dot.classList.toggle('active', i === current));
        }
        function scheduleNext() {
          clearTimeout(timer);
          timer = setTimeout(() => { showSlide(current + 1); scheduleNext(); }, 15000);
        }
        dots.forEach((dot, i) => dot.addEventListener('click', () => { showSlide(i); scheduleNext(); }));
        showSlide(0);
        scheduleNext();
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    })();
`;

/* ───────────── UTILITÀ ───────────── */
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const rich = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
const has = s => String(s ?? '').trim() !== '';

function media(url) {
  url = String(url || '').trim();
  if (!url) return null;
  let m = url.match(/drive\.google\.com\/.*?\/d\/([\w-]{10,})/) || url.match(/drive\.google\.com\/.*?[?&]id=([\w-]{10,})/);
  if (m) return { kind: 'Google Drive', embed: `https://drive.google.com/file/d/${m[1]}/preview`, view: `https://drive.google.com/file/d/${m[1]}/view` };
  m = url.match(/(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);
  if (m) return { kind: 'YouTube', embed: `https://www.youtube.com/embed/${m[1]}`, view: `https://www.youtube.com/watch?v=${m[1]}` };
  m = url.match(/vimeo\.com\/(?:video\/)?(\d+)/);
  if (m) return { kind: 'Vimeo', embed: `https://player.vimeo.com/video/${m[1]}`, view: `https://vimeo.com/${m[1]}` };
  return { kind: 'other', embed: url, view: url };
}

/* ───────────── STATO E SALVATAGGIO ───────────── */
const KEY = 'gdb-site-admin-v1';
const clone = o => JSON.parse(JSON.stringify(o));

function normalize(d) {
  const base = clone(DEFAULT_DATA);
  if (!d || typeof d !== 'object') return base;
  const out = {
    general: Object.assign(base.general, d.general || {}),
    bio: Object.assign(base.bio, d.bio || {}),
    music: Array.isArray(d.music) ? d.music : base.music,
    videos: Array.isArray(d.videos) ? d.videos : base.videos,
    experiences: Array.isArray(d.experiences) ? d.experiences : base.experiences,
    contacts: Object.assign(base.contacts, d.contacts || {})
  };
  if (!Array.isArray(out.contacts.extraLinks)) out.contacts.extraLinks = [];
  return out;
}

let state;
try { state = normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { state = clone(DEFAULT_DATA); }

let saveTimer;
function save() {
  clearTimeout(saveTimer);
  document.getElementById('status').textContent = 'Salvataggio…';
  saveTimer = setTimeout(() => {
    try { localStorage.setItem(KEY, JSON.stringify(state)); document.getElementById('status').textContent = 'Modifiche salvate in questo browser'; }
    catch (e) { document.getElementById('status').textContent = 'Salvataggio non riuscito: esporta un backup'; }
    updateCounts();
  }, 300);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200);
}

/* ───────────── COMPONENTI UI ───────────── */
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function field(f, obj, after) {
  const w = el('label', 'field' + (f.wide || f.t === 'area' ? ' wide' : ''));
  w.append(el('span', 'lab', f.l));
  const inp = document.createElement(f.t === 'area' ? 'textarea' : 'input');
  if (f.t === 'area') inp.rows = f.rows || 3; else inp.type = 'text';
  inp.value = obj[f.k] ?? '';
  if (f.ph) inp.placeholder = f.ph;
  w.append(inp);
  const hint = el('span', 'hint', f.hint || '');
  if (f.hint || f.media) w.append(hint);
  const check = () => {
    if (!f.media) return;
    const m = media(inp.value);
    if (!m) { hint.textContent = f.hint || ''; hint.className = 'hint'; }
    else if (m.kind === 'other') { hint.textContent = 'Link non riconosciuto: verrà usato così com’è come player.'; hint.className = 'hint warn'; }
    else { hint.textContent = `✓ Link ${m.kind} riconosciuto`; hint.className = 'hint ok'; }
  };
  inp.addEventListener('input', () => { obj[f.k] = inp.value; save(); check(); after && after(); });
  check();
  return w;
}

function objEditor(obj, fields) {
  const g = el('div', 'fields');
  fields.forEach(f => g.append(field(f, obj)));
  return g;
}

function iconBtn(sym, label, fn, disabled) {
  const b = el('button', 'icon', sym);
  b.type = 'button'; b.title = label; b.setAttribute('aria-label', label);
  b.disabled = !!disabled; b.onclick = fn;
  return b;
}

function listEditor(arr, schema) {
  const wrap = el('div', 'list');
  const titleOf = it => (schema.titleKey && has(it[schema.titleKey])) ? it[schema.titleKey] : schema.untitled || 'Senza titolo';

  const draw = focusIndex => {
    wrap.innerHTML = '';
    const addBtn = el('button', 'add', '+ ' + schema.addLabel);
    addBtn.type = 'button';
    addBtn.onclick = () => {
      const blank = {}; schema.fields.forEach(f => blank[f.k] = '');
      if (schema.addTop) { arr.unshift(blank); draw(0); } else { arr.push(blank); draw(arr.length - 1); }
      save();
    };
    if (schema.addTop) wrap.append(addBtn);
    if (!arr.length) wrap.append(el('p', 'hint', schema.empty || 'Nessun elemento. Aggiungine uno.'));

    arr.forEach((item, i) => {
      const card = el('div', 'item');
      const head = el('div', 'item-head');
      const t = el('span', 'item-title', titleOf(item));
      const acts = el('div', 'item-actions');
      acts.append(
        iconBtn('↑', 'Sposta su', () => { [arr[i - 1], arr[i]] = [arr[i], arr[i - 1]]; save(); draw(); }, i === 0),
        iconBtn('↓', 'Sposta giù', () => { [arr[i + 1], arr[i]] = [arr[i], arr[i + 1]]; save(); draw(); }, i === arr.length - 1),
        iconBtn('✕', 'Elimina', () => { if (confirm(`Eliminare “${titleOf(item)}”?`)) { arr.splice(i, 1); save(); draw(); } })
      );
      head.append(el('span', 'item-n', String(i + 1)), t, acts);
      card.append(head);
      const g = el('div', 'fields');
      schema.fields.forEach(f => g.append(field(f, item, () => t.textContent = titleOf(item))));
      card.append(g);
      wrap.append(card);
      if (i === focusIndex) setTimeout(() => { card.scrollIntoView({ block: 'center' }); card.querySelector('input,textarea').focus(); }, 0);
    });
    if (!schema.addTop) wrap.append(addBtn);
  };
  draw();
  return wrap;
}

  }},
  { id: 'experiences', label: 'Esperienze', count: () => state.experiences.length, render: p => {
    p.append(el('h2', null, 'Esperienze'), el('p', 'lead', 'Concerti, festival, workshop. I nuovi vengono aggiunti in cima.'));
    p.append(listEditor(state.experiences, { addLabel: 'Aggiungi esperienza', titleKey: 'title', addTop: true,
      fields: [{ k: 'date', l: 'Data', ph: '22 / 03 / 2026' }, { k: 'place', l: 'Luogo', ph: 'Bologna, Italy' },
               { k: 'title', l: 'Titolo', wide: true },
               { k: 'desc', l: 'Descrizione', t: 'area', rows: 2, hint: RICH_HINT }] }));
  }},
  { id: 'contacts', label: 'Contatti', render: p => {
    p.append(el('h2', null, 'Contatti'), el('p', 'lead', 'I campi lasciati vuoti non vengono mostrati sul sito.'));
    p.append(objEditor(state.contacts, [
      { k: 'email', l: 'Email' }, { k: 'phone', l: 'Telefono' },
      { k: 'city', l: 'Città' }, { k: 'instagram', l: 'Profilo Instagram' },
      { k: 'cv', l: 'Link al CV', wide: true }
    ]));
    p.append(el('h3', null, 'Altri link'));
    p.append(listEditor(state.contacts.extraLinks, { addLabel: 'Aggiungi link', titleKey: 'label', untitled: 'Nuovo link',
      empty: 'Nessun link aggiuntivo. Puoi aggiungere SoundCloud, Bandcamp, YouTube…',
      fields: [{ k: 'label', l: 'Nome', ph: 'SoundCloud' }, { k: 'url', l: 'Indirizzo', ph: 'https://…' }] }));
  }},
  { id: 'export', label: 'Pubblica', render: p => {
    p.append(el('h2', null, 'Pubblica'), el('p', 'lead', 'Controlla l’anteprima, poi scarica il nuovo index.html e sostituiscilo a quello online.'));
    const note = el('div', 'note');
    note.innerHTML = '<b>Come aggiornare il sito:</b> scarica <code>index.html</code>, caricalo sul tuo hosting al posto di quello vecchio, insieme a eventuali nuove immagini nella cartella <code>images</code>. Le modifiche restano salvate in questo browser; esporta un backup se cambi computer.';
    p.append(note);

    const a1 = el('div', 'actions');
    const dl = el('button', 'btn primary', 'Scarica index.html'); dl.onclick = () => download('index.html', buildSite(state), 'text/html');
    const pv = el('button', 'btn', 'Aggiorna anteprima'); pv.onclick = () => { frame.srcdoc = buildSite(state); toast('Anteprima aggiornata'); };
    const cp = el('button', 'btn', 'Copia codice HTML'); cp.onclick = async () => {
      try { await navigator.clipboard.writeText(buildSite(state)); toast('Codice copiato'); } catch (e) { toast('Copia non riuscita: usa Scarica index.html'); }
    };
    a1.append(dl, pv, cp);
    p.append(a1);

    const frame = el('iframe', 'preview');
    frame.title = 'Anteprima del sito';
    frame.srcdoc = buildSite(state);
    p.append(frame);
    p.append(el('p', 'hint', 'Le foto si vedono nell’anteprima solo se admin.html si trova nella stessa cartella del sito.'));

    p.append(el('h3', null, 'Backup e ripristino'));
    const a2 = el('div', 'actions');
    const ex = el('button', 'btn', 'Esporta backup'); ex.onclick = () => download('sito-backup.json', JSON.stringify(state, null, 2), 'application/json');
    const im = el('button', 'btn', 'Importa backup o index.html'); im.onclick = () => document.getElementById('importFile').click();
    const rs = el('button', 'btn danger', 'Ripristina contenuti originali'); rs.onclick = () => {
      if (confirm('Tutte le modifiche fatte qui verranno perse. Continuare?')) { state = clone(DEFAULT_DATA); save(); renderAll('export'); toast('Contenuti originali ripristinati'); }
    };
    a2.append(ex, im, rs);
    p.append(a2);
    p.append(el('p', 'hint', 'Puoi importare anche un index.html generato da questa pagina: i contenuti vengono letti direttamente dal file.'));
  }}
];

function download(name, text, type) {
  const url = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast(name + ' scaricato');
}

document.getElementById('importFile').addEventListener('change', e => {
  const file = e.target.files[0]; if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      let data;
      if (/\.html?$/i.test(file.name)) {
        const doc = new DOMParser().parseFromString(r.result, 'text/html');
        const s = doc.getElementById('site-data');
        if (!s) throw new Error('Questo index.html non è stato creato con il pannello: importa un backup .json.');
        data = JSON.parse(s.textContent);
      } else data = JSON.parse(r.result);
      state = normalize(data); save(); renderAll('export'); toast('Contenuti importati');
    } catch (err) { alert(err.message || 'File non valido.'); }
    e.target.value = '';
  };
  r.readAsText(file);
});

/* ───────────── NAVIGAZIONE ───────────── */
const tabsEl = document.getElementById('tabs'), mainEl = document.getElementById('main');
let current = 'general';

function updateCounts() {
  TABS.forEach(t => { if (t.count) { const c = tabsEl.querySelector(`[data-tab="${t.id}"] .count`); if (c) c.textContent = t.count(); } });
}

function renderAll(show) {
  current = show || current;
  tabsEl.querySelectorAll('.tab').forEach(b => b.remove());
  mainEl.innerHTML = '';
  const status = document.getElementById('status');
  TABS.forEach(t => {
    const b = el('button', 'tab' + (t.id === current ? ' on' : ''));
    b.type = 'button'; b.dataset.tab = t.id;
    b.append(el('span', null, t.label));
    if (t.count) b.append(el('span', 'count', t.count()));
    b.onclick = () => select(t.id);
    tabsEl.insertBefore(b, status);
    const p = el('section', 'panel' + (t.id === current ? ' on' : ''));
    p.id = 'panel-' + t.id;
    t.render(p);
    mainEl.append(p);
  });
}

function select(id) {
  current = id;
  tabsEl.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
  mainEl.querySelectorAll('.panel').forEach(p => p.classList.toggle('on', p.id === 'panel-' + id));
  if (id === 'export') { const f = mainEl.querySelector('.preview'); if (f) f.srcdoc = buildSite(state); }
  window.scrollTo(0, 0);
}

renderAll();
</script>
